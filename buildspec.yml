version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  pre_build:
    commands:
      - echo "Java version:"
      - java -version
      - echo "Maven version:"
      - mvn -version

  build:
    commands:
      - echo "Running backend build and JUnit tests..."
      - mvn -f backend/pom.xml clean verify

  post_build:
    commands:
      - echo "Backend build completed."
      - echo "Generated JAR files:"
      - find backend/target -maxdepth 1 -type f -name "*.jar" -print

reports:
  junit-reports:
    files:
      - "*.xml"
    base-directory: backend/target/surefire-reports
    file-format: JUNITXML

artifacts:
  base-directory: backend/target
  files:
    - "*.jar"
  discard-paths: yes
