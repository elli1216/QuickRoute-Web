spring.application.name=mock-server

# Default profile for local runs and tests (H2 in-memory).
# Containers/production must set SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.default=dev

# JPA/Hibernate
# Dialect is set per profile: dev -> H2Dialect, prod -> PostgreSQLDialect.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Caching
spring.cache.type=simple
spring.cache.cache-names=mocks

# Server
server.port=8080
server.servlet.context-path=/